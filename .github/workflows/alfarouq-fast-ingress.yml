name: ALFAROUQ Fast Ingress

on:
  push:
    branches: [main]
    paths:
      - '.alfarouq/command.json'

permissions:
  contents: read

jobs:
  dispatch:
    if: github.actor == 'zongsm-cmyk'
    runs-on: ubuntu-latest
    env:
      BROKER_URL: https://alfarouq-broker-production.up.railway.app
      BROKER_TOKEN: ${{ secrets.ALFAROUQ_BROKER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Build signed GitHub-style ingress request
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          if (!process.env.BROKER_TOKEN) throw new Error('ALFAROUQ_BROKER_TOKEN missing');
          const spec = JSON.parse(fs.readFileSync('.alfarouq/command.json','utf8'));

          const fakeIssueId = Number(String(Date.now()).slice(-12));
          const payload = {
            action: 'opened',
            issue: {
              id: fakeIssueId,
              title: '[ALFAROUQ] ChatGPT command',
              body: JSON.stringify(spec),
              user: { login: 'zongsm-cmyk' }
            }
          };

          const raw = JSON.stringify(payload);
          const sig = crypto.createHmac('sha256', process.env.BROKER_TOKEN).update(raw).digest('hex');
          fs.writeFileSync('github-event.json', raw);
          fs.writeFileSync('signature.txt', sig);
          fs.writeFileSync('expected_request_id.txt', 'gh-' + fakeIssueId);
          NODE

      - name: Send to broker signing ingress
        shell: bash
        run: |
          SIG="$(cat signature.txt)"
          curl --fail-with-body --silent --show-error \
            -X POST "$BROKER_URL/v1/github-command" \
            -H "x-github-event: issues" \
            -H "x-hub-signature-256: sha256=$SIG" \
            -H "Content-Type: application/json" \
            --data-binary @github-event.json

      - name: Print expected request id
        shell: bash
        run: |
          echo "ALFAROUQ_EXPECTED_REQUEST_ID=$(cat expected_request_id.txt)"
