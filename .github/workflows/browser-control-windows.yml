name: Browser Control Windows Validation

on:
  push:
    branches:
      - browser-control-chrome-use-v1
    paths:
      - "AGENTS.md"
      - "tools/bootstrap-browser-control.ps1"
      - "tools/smoke-browser-control.ps1"
      - ".github/workflows/browser-control-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned chrome-use
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:AGENT_BROWSER_VERSION = "v1.5.139"
          Invoke-RestMethod https://raw.githubusercontent.com/leeguooooo/chrome-use/main/install.ps1 | Invoke-Expression
          $chromeUseDir = Join-Path $env:LOCALAPPDATA "Programs\chrome-use"
          if (-not (Test-Path (Join-Path $chromeUseDir "chrome-use.exe"))) { throw "chrome-use missing after install" }
          Add-Content $env:GITHUB_PATH $chromeUseDir

      - name: Verify CLI
        shell: pwsh
        run: |
          chrome-use --version
          chrome-use --help

      - name: Verify installed agent skill
        shell: pwsh
        run: |
          chrome-use doctor

      - name: Record validation
        shell: pwsh
        run: |
          "Cloud Windows validation PASS: pinned installer, CLI, Chrome detection, native host diagnostics and bundled agent skill work." | Out-File browser-control-validation.txt
          "Expected cloud-runner limitation: extension/native-messaging is not connected because the runner has no interactive local browser profile." | Out-File browser-control-validation.txt -Append

      - uses: actions/upload-artifact@v4
        with:
          name: browser-control-validation
          path: browser-control-validation.txt
