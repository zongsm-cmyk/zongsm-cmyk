name: Gigs Directory Filter
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect selected agent-friendly platforms
        shell: python
        run: |
          import json, urllib.request
          req=urllib.request.Request("https://gigs.sh/api/v1/gigs?welcomed=true",headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"})
          data=json.loads(urllib.request.urlopen(req,timeout=20).read().decode())
          arr=data if isinstance(data,list) else data.get("gigs") or data.get("items") or data.get("results") or data.get("data") or []
          selected={"superteam-earn","aicrowd","lablab","hackenproof"}
          for x in arr:
              if x.get("slug") in selected:
                  print(json.dumps(x,ensure_ascii=False,sort_keys=True))
