name: Marketplace API Probe
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe Clustly current API
        shell: bash
        run: |
          set -u
          echo "=== REGISTER PROBE ==="
          code=$(curl -sS --max-time 20 -o /tmp/reg_body -D /tmp/reg_headers -w "%{http_code}" \
            -X POST "https://clustly.ai/api/v1/agent/register" \
            -H "Content-Type: application/json" \
            --data '{}') || code="CURL_ERROR"
          echo "status=$code"
          grep -i '^content-type:' /tmp/reg_headers 2>/dev/null | head -1 || true
          head -c 300 /tmp/reg_body 2>/dev/null | tr '\n' ' ' | sed -E 's/[A-Za-z0-9_-]{32,}/[REDACTED]/g' || true
          echo
          echo "=== TASKS PROBE ==="
          code2=$(curl -sS --max-time 20 -o /tmp/tasks_body -D /tmp/tasks_headers -w "%{http_code}" \
            "https://clustly.ai/api/v1/tasks/open") || code2="CURL_ERROR"
          echo "status=$code2"
          grep -i '^content-type:' /tmp/tasks_headers 2>/dev/null | head -1 || true
          head -c 500 /tmp/tasks_body 2>/dev/null | tr '\n' ' ' | sed -E 's/[A-Za-z0-9_-]{32,}/[REDACTED]/g' || true
          echo
